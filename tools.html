<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Tools · Her Money & AI</title>
<meta name="description" content="Free calculators and tools for Canadian parents — EI, RESP, and more, by Kirti Thakran.">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B2D4F;--tc:#C17C74;--tc-d:#A8635B;--tc-l:#FAF3F1;--tc-m:#E8B5AB;--dark:#2c2c2c;--mid:#666;--light:#AAA;--border:#e8ddd9}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:'Lato',sans-serif;background:#fff;color:var(--dark);min-height:100vh}
.hdr{background:var(--navy);padding:13px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-family:'Lora',serif;font-size:15px;font-weight:700;color:#fff;text-decoration:none}
.logo em{color:var(--tc-m);font-style:italic;font-weight:400}
.hamburger{background:none;border:none;cursor:pointer;padding:4px;display:flex;flex-direction:column;gap:4px;width:28px}
.hamburger span{display:block;height:2px;width:100%;background:#fff;border-radius:2px}
.menu-overlay{position:fixed;inset:0;background:rgba(27,45,79,0.4);z-index:199;opacity:0;pointer-events:none;transition:opacity 0.25s}
.menu-overlay.open{opacity:1;pointer-events:auto}
.menu-panel{position:fixed;top:0;right:-280px;width:260px;height:100%;background:#fff;z-index:200;transition:right 0.3s ease;padding:24px 0;overflow-y:auto}
.menu-panel.open{right:0}
.menu-close{background:none;border:none;font-size:20px;color:var(--mid);padding:0 20px 20px;cursor:pointer;display:block}
.menu-item{display:flex;align-items:center;gap:12px;padding:15px 22px;text-decoration:none;color:var(--dark);font-family:'Poppins',sans-serif;font-size:13.5px;font-weight:600;border-bottom:0.5px solid var(--border)}
.menu-item span.mi-icon{font-size:16px}

.hero{background:var(--navy);padding:32px 20px 30px;text-align:center}
.eyebrow{font-family:'Poppins',sans-serif;font-size:10px;letter-spacing:0.18em;color:var(--tc-m);font-weight:700;margin-bottom:10px}
.h1{font-family:'Lora',serif;font-size:26px;font-weight:700;color:#fff;line-height:1.3}
.h1 em{font-style:italic;font-weight:400;color:var(--tc-m)}
.h-sub{font-size:12px;color:rgba(255,255,255,0.65);margin-top:10px;max-width:300px;margin-left:auto;margin-right:auto}

.list{padding:22px 20px 40px;display:flex;flex-direction:column;gap:14px}
.gcard{display:block;text-decoration:none;background:#fff;border:0.5px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 3px 16px rgba(27,45,79,0.06);transition:transform 0.15s}
.gcard.disabled{opacity:0.55}
.gcard:active{transform:scale(0.98)}
.gc-top{display:flex;gap:14px;padding:18px;align-items:center}
.gc-icon{width:56px;height:56px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.gc-body{flex:1;min-width:0}
.gc-title{font-family:'Lora',serif;font-size:15.5px;font-weight:700;color:var(--dark);line-height:1.35}
.gc-desc{font-size:11.5px;color:var(--mid);line-height:1.5;margin-top:5px}
.gc-bottom{display:flex;align-items:center;justify-content:flex-end;padding:12px 18px;background:var(--tc-l);border-top:0.5px solid var(--border)}
.gc-btn{font-family:'Poppins',sans-serif;font-size:10.5px;font-weight:700;color:#fff;background:var(--tc);padding:9px 18px;border-radius:99px}
.gc-btn.soon{background:#ccc}

.footer{background:var(--tc-l);padding:20px;text-align:center;font-family:'Lato',sans-serif;font-size:10px;color:var(--light);line-height:1.7;margin-top:8px}
.footer strong{color:var(--dark)}
.loading{text-align:center;padding:30px;font-family:'Poppins',sans-serif;font-size:11px;color:var(--light)}
</style>
</head>
<body>

<header class="hdr">
  <a href="index.html" class="logo">Her Money <em>& AI</em></a>
  <button class="hamburger" onclick="toggleMenu(true)" aria-label="Open menu"><span></span><span></span><span></span></button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<nav class="menu-panel" id="menuPanel">
  <button class="menu-close" onclick="toggleMenu(false)">✕</button>
  <a href="about.html" class="menu-item"><span class="mi-icon">🍁</span>About Me</a>
  <a href="picks.html" class="menu-item"><span class="mi-icon">✦</span>Favourite Picks</a>
  <a href="guides.html" class="menu-item"><span class="mi-icon">📘</span>Guides</a>
  <a href="tools.html" class="menu-item"><span class="mi-icon">🧮</span>Free Tools</a>
  <a href="partner-with-me.html" class="menu-item"><span class="mi-icon">🤝</span>Partner With Me</a>
  <a href="information-directory.html" class="menu-item"><span class="mi-icon">📂</span>Information Directory</a>
</nav>

<section class="hero">
  <div class="eyebrow">🧮 FREE TOOLS</div>
  <div class="h1">Real numbers, <em>not guesswork</em></div>
  <div class="h-sub">Calculators built with verified 2026 rates — no email required to try.</div>
</section>

<div class="list" id="tools-list"><div class="loading">Loading tools...</div></div>

<footer class="footer">
  <strong>Her Money & AI</strong> · Kirti Thakran · hermoneyandai.ca 🍁
</footer>

<script>
function toggleMenu(open){
  document.getElementById('menuOverlay').classList.toggle('open', open);
  document.getElementById('menuPanel').classList.toggle('open', open);
}

fetch('https://opensheet.elk.sh/1FnnAMlJrma3nKgymYg77t0rI_s5Y0zbFOMZUd0PB9wU/data')
  .then(r=>{if(!r.ok)throw new Error();return r.json();})
  .then(all=>{
    const items=all
      .map(r=>{const o={};Object.keys(r).forEach(k=>{o[k.toLowerCase()]=r[k];});return o;})
      .filter(r=>r.page==='tools'&&r.title);
    const list=document.getElementById('tools-list');
    if(!items.length){list.innerHTML='<div class="loading">No tools yet.</div>';return;}
    list.innerHTML='';
    items.forEach(t=>{
      const col=t.color||'#7D6E8A';
      const isLive=t.live==='yes';
      const el=document.createElement(isLive?'a':'div');
      el.className='gcard'+(isLive?'':' disabled');
      if(isLive){el.href=t.url;el.target=t.url&&t.url.startsWith('http')?'_blank':'_self';el.rel='noopener noreferrer';}
      el.innerHTML=`<div class="gc-top">
          <div class="gc-icon" style="background:${col}22">${t.emoji||'🔧'}</div>
          <div class="gc-body"><div class="gc-title">${t.title}</div><div class="gc-desc">${t.description||''}</div></div>
        </div>
        <div class="gc-bottom">
          <div class="gc-btn ${isLive?'':'soon'}">${isLive?(t.button_text||'Try Free →'):'Coming Soon'}</div>
        </div>`;
      list.appendChild(el);
    });
  })
  .catch(()=>{document.getElementById('tools-list').innerHTML='<div class="loading">Couldn\'t load tools right now.</div>';});
</script>

</body>
</html>
